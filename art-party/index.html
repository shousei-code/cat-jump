<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ププさんのおえかき大会</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7df;color:#66555f;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:clamp(22px,4vw,32px)}a{color:#9a7b96}button,input,select{font:inherit;border:1px solid #ddc7be;border-radius:13px;padding:11px;background:#fffef9;color:#795c70}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #b492bd}.tools,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:16px 0}.panel{padding:22px;border:1px solid #e6d2bc;background:#fffdf5;border-radius:24px;margin:18px 0}canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;background:white;border:2px solid #dfc9bc;border-radius:15px;touch-action:none}.swatch{width:39px;height:39px;padding:0;border:3px solid white;box-shadow:0 0 0 1px #d2bfc5}.swatch.active{outline:3px solid #8c7397}.primary{background:#a180a8;color:white}h2{font-size:21px;margin:0 0 12px}.note{font-size:12px;line-height:1.8;color:#a08c91}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.entry{padding:12px;background:#fffdfa;border:1px solid #e6d2bc;border-radius:18px}.entry img,.entry svg{display:block;width:100%;aspect-ratio:4/3;background:white;border:1px solid #eee2da;border-radius:10px}.entry b{display:block;font-size:14px;margin-bottom:8px}.ribbon{background:#f7df96}.judge{padding:20px;background:#f4e5f6;border-radius:20px;font-size:16px;line-height:1.9;white-space:pre-line}input[type=text]{width:150px}.note a{color:inherit}#status{min-height:24px}[hidden]{display:none!important}@media(max-width:600px){main{padding:14px}.panel{padding:15px}.gallery{grid-template-columns:1fr 1fr;gap:10px}.entry{padding:9px}.tools{gap:7px}button{font-size:13px}input[type=range]{width:100px}}
</style><main><header><h1>🎨 ププさんのおえかき大会</h1><a href="../">ゲームひろばへ</a></header><p class="note">パパや果物の仲間たちと、12人のおえかき対決！ お題の絵を描いたら、みんなの作品を見てみよう。</p><div class="tools"><label>自分の名前 <input id="name" type="text" maxlength="12" value="えんか"></label><label>お題 <select id="theme"><option value="flower">お花</option><option value="house">おうち</option><option value="face">にこにこ顔</option></select></label></div><section class="panel" id="drawing"><h2 id="prompt">お題：お花</h2><div class="tools" id="palette"></div><div class="tools"><label>太さ <input id="size" type="range" min="2" max="30" value="8"></label><button id="eraser" aria-pressed="false">消しゴム</button><button id="undo">ひとつ戻す</button><button id="clear">全部消す</button></div><canvas id="canvas" width="800" height="600" aria-label="指やマウスでお題の絵を描く場所"></canvas><div class="actions"><button class="primary" id="submit">できた！ みんなの絵を見る</button><button id="download">自分の絵を保存</button></div></section><p id="status" role="status"></p><section id="exhibition" hidden><h2>🖼 みんなの展覧会</h2><div class="gallery" id="gallery"></div><div class="actions"><button id="judge" class="primary">👑 ププさんに審査してもらう</button><button id="back">自分の絵を描き直す</button></div><div class="judge" id="result" hidden></div><div class="actions"><button id="again" hidden>次のおえかき大会へ</button></div></section><p class="note">ププさんの大賞は、毎回くじで決まるお楽しみ審査です。絵の上手さを自動判定するものではありません。<br>自分の絵は「保存」で画像にできます。名前以外の作品や大会の途中経過は、再読み込みすると消えます。</p></main><script src="game.js"></script></html>
