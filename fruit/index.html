<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>りんごとバナナのブーブーダンス</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7da;color:#665345;font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:clamp(22px,4vw,32px)}a{font-size:12px;color:#96815d}.stage{position:relative;height:350px;border:2px solid #ead5a4;background:linear-gradient(#dff3f0 70%,#efce9c 70%);border-radius:28px;overflow:hidden;display:flex;align-items:end;justify-content:space-around;padding:40px 10px}.actor{font-size:clamp(55px,12vw,90px);position:relative;text-align:center;min-width:65px}.actor small{display:block;font-size:13px;margin-top:13px}.actor .tear{position:absolute;right:0;top:30px;font-size:26px}.dance{animation:dance .55s infinite alternate}.poke{animation:poke .2s 3 alternate}.cloud{position:absolute;right:14%;bottom:140px;font-size:55px;animation:float 1s infinite alternate}.bubble{position:absolute;top:25px;left:10%;right:10%;background:#fffdf5;border-radius:24px;padding:17px;text-align:center;line-height:1.7;font-weight:bold}.card{background:#fffdf5;border:1px solid #ead6b7;border-radius:22px;padding:22px;margin-top:18px}button{font:inherit;border:1px solid #d9bf96;border-radius:16px;background:#fff3cf;color:#795943;padding:15px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #b791c1}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.actions button{flex:1;min-width:130px}.primary{background:#c88768;color:white}.note{font-size:12px;line-height:1.8;color:#9d8a70}#progress{color:#a88a55;font-size:14px}#text{line-height:1.8}#spark{position:absolute;right:12%;bottom:190px;font-size:40px}.utility{display:flex;gap:10px;flex-wrap:wrap}button:disabled{opacity:.5}[hidden]{display:none!important}@keyframes dance{from{transform:translateY(0) rotate(-9deg)}to{transform:translateY(-15px) rotate(9deg)}}@keyframes poke{to{transform:translateX(30px) rotate(12deg)}}@keyframes float{to{transform:translateX(-30px);opacity:.4}}@media(max-width:500px){main{padding:14px}.stage{height:320px;padding-bottom:30px}.actor{font-size:55px}.actor small{font-size:11px}.bubble{font-size:14px;left:5%;right:5%}.card{padding:18px}.actor .tear{font-size:20px}}@media(prefers-reduced-motion:reduce){.dance,.poke,.cloud{animation:none}}</style><main><header><h1>🍎🍌 ブーブーダンス！</h1><a href="../">ゲームひろばへ</a></header><p class="note">へんてこな仲間と、おかしな一日。ボタンを押してお話を進めよう！</p><div id="progress"></div><section class="stage"><div class="bubble" id="bubble"></div><div class="actor" id="apple"><span>🍎</span><span class="tear" hidden>💧</span><small>りんご</small></div><div class="actor" id="banana"><span>🍌</span><small>バナナ</small></div><div class="actor" id="poop"><span>💩</span><span class="tear" hidden>💧</span><small>うんこくん</small></div><div class="actor" id="dad"><span>👨</span><small>パパ</small></div><div class="cloud" id="cloud" hidden>💨</div><div id="spark" hidden>💫</div></section><section class="card"><h2 id="title"></h2><p id="text"></p><div class="actions" id="choices"></div></section><div class="utility"><button id="sound" aria-pressed="false">音 ON</button><button id="restart">最初から</button></div><p class="note">音は小さめのコミカルな効果音です。音なしでも遊べます。ぽかぽかは、けがをしない漫画の演出です。</p></main><script src="game.js"></script></html>
