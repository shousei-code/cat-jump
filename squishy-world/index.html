<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f9e9f1" />
    <title>ぷにぷにワールド ♡ スクイーズの家</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="world" aria-label="スクイーズを探す3Dの世界"></canvas>
    <header>
      <a href="../">← ゲームひろば</a
      ><strong>ぷにぷにワールド <small>SQUISHY WORLD</small></strong
      ><span id="coins">✧ 80</span>
    </header>
    <nav id="menu">
      <button data-panel="maps">🌈 マップ</button
      ><button data-panel="house">🏠 おうち</button
      ><button data-panel="collection">📖 ずかん</button
      ><button data-panel="gacha">🎀 ガチャ</button
      ><button data-panel="job">📦 お仕事</button
      ><button data-panel="memory">🧠 ミニゲーム</button
      ><button data-panel="avatar">☺ きせかえ</button>
    </nav>
    <aside id="guide">
      <b id="mapName"></b>
      <p>
        矢印 / WASD で移動・スペースでジャンプ<br />白い旗はチェックポイント。金の旗を目指そう！
      </p>
      <span id="progress"></span><button id="home">スタートへ戻る</button>
    </aside>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="roomBadge" hidden></div>
    <div id="touch">
      <div class="pad">
        <button data-move="up" aria-label="前に進む">▲</button>
        <div>
          <button data-move="left" aria-label="左へ">◀</button
          ><button data-move="down" aria-label="後ろへ">▼</button
          ><button data-move="right" aria-label="右へ">▶</button>
        </div>
      </div>
      <button id="jump">ジャンプ</button>
    </div>
    <dialog id="dialog">
      <button id="close" aria-label="閉じる">×</button>
      <div id="panel"></div>
    </dialog>
    <script type="module" src="game.js"></script>
  </body>
</html>
