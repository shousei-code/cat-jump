name: Umi gamer checks
on:
  push:
    paths: ['umi/**', '.github/workflows/umi-ci.yml']
  pull_request:
    paths: ['umi/**', '.github/workflows/umi-ci.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test umi/tests/core.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python umi/tests/browser.py
