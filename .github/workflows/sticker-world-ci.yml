name: Sticker island checks
on:
  push:
    paths: ['sticker-world/**', '.github/workflows/sticker-world-ci.yml']
  pull_request:
    paths: ['sticker-world/**', '.github/workflows/sticker-world-ci.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix sticker-world
      - run: npm test --prefix sticker-world
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python sticker-world/tests/browser.py
      - name: Real WebRTC room check with local signaling
        run: |
          node sticker-world/tests/signal.cjs &
          SIGNAL_PID=$!
          trap 'kill "$SIGNAL_PID"' EXIT
          python sticker-world/tests/network.py
