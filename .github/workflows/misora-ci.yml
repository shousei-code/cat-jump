name: Misora school checks
on:
  push:
    paths: ['misora/**', '.github/workflows/misora-ci.yml']
  pull_request:
    paths: ['misora/**', '.github/workflows/misora-ci.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test misora/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python misora/tests/browser.py
      - run: python misora/tests/school-browser.py
      - run: python misora/tests/player-browser.py
      - run: python misora/tests/rin-browser.py
