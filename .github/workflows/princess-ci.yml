name: Princess checks
on:
  push:
    paths: ["princess/**", ".github/workflows/princess-ci.yml"]
  pull_request:
    paths: ["princess/**", ".github/workflows/princess-ci.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: princess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: princess/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: princess-review
          path: |
            princess/dist
            princess/playwright-report
            princess/test-results
