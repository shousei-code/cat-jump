name: Squishy world checks
on:
  push:
    paths: ['squishy-world/**', 'sticker-world/vendor/**', '.github/workflows/squishy-world-ci.yml']
  pull_request:
    paths: ['squishy-world/**', 'sticker-world/vendor/**', '.github/workflows/squishy-world-ci.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test squishy-world/tests/core.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python squishy-world/tests/browser.py
      - run: python squishy-world/tests/movement.py
