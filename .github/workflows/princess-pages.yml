name: Publish reviewed Princess and existing games
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: princess/package-lock.json
      - run: npm ci
        working-directory: princess
      - run: npm run check
        working-directory: princess
      - name: Preserve existing games and add built Princess
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/princess _site/princess-play _site/.github
          cp -R princess/dist _site/princess-play
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
