<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ことば冒険ギルド</title><style>*{box-sizing:border-box}body{margin:0;background:#eff3ed;color:#41584e;font-family:system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(23px,4vw,34px)}a{color:#688875}button,select{font:inherit;padding:12px 16px;border:1px solid #b9cdbe;background:#fbfff9;color:#466650;border-radius:13px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}button:focus-visible,select:focus-visible{outline:3px solid #bd9d53;outline-offset:2px}.primary{background:#678d78;color:white}.hud,.nav,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:17px 0}.hud span{padding:10px 14px;border-radius:15px;background:#fffdf5;font-size:13px}.nav button[aria-pressed=true]{background:#678d78;color:white}.panel{background:#fffdf6;border:1px solid #d5dfcc;border-radius:24px;padding:22px;margin-top:15px}h2{font-size:20px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:18px;border:1px solid #d4dfcf;border-radius:18px;background:#f4f7eb}.card b{display:block;font-size:18px}.card p{font-size:13px;line-height:1.8}.card button{width:100%}.icon{font-size:44px}.note{font-size:12px;line-height:1.9;color:#8b9a87}.teams{display:grid;grid-template-columns:1fr 1fr;gap:20px}.unit{padding:12px;background:#eef4e9;border-radius:14px;margin:8px 0;font-size:14px}.unit small{display:block;margin-top:7px}.hp{height:7px;border-radius:7px;background:#dbdfd3;margin-top:7px}.hp i{display:block;height:100%;background:#94b38c;border-radius:7px}.enemy .hp i{background:#d6a387}.question{text-align:center;background:#f5ebd4;border-radius:20px;padding:22px;margin-top:20px}.question strong{font-size:36px;display:block;margin:12px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.answers button{font-size:18px;background:#fffdf6}.bag span{display:inline-block;padding:8px 12px;margin:4px;background:#e9efdf;border-radius:12px}#status{min-height:45px;line-height:1.8}.log{font-size:13px;line-height:1.8;color:#80917c}.reward{background:#f7e8bd;padding:18px;border-radius:15px}.selected{outline:3px solid #8ead7f}[hidden]{display:none!important}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:13px}.card b{font-size:16px}.panel{padding:16px}.teams{gap:10px}.unit{font-size:12px;padding:10px}.answers{gap:7px}.answers button{font-size:15px;padding:13px 6px}.question{padding:15px}.question strong{font-size:30px}.nav button{font-size:12px;padding:10px}}</style><main><header><h1>📖 ことば冒険ギルド</h1><a href="../">ゲームひろばへ</a></header><p class="note">町で仲間を集めて、漢字の力で冒険！ チーム戦・アイテム交換・宝探し・依頼を楽しもう。<br>一人用ゲームです。仲間・対戦相手・交換相手はゲーム内のキャラクターです。</p><div class="hud"><span id="coins"></span><span id="wins"></span><span id="level"></span></div><nav class="nav" id="nav"><button data-tab="town">🏡 町</button><button data-tab="team">🛡 チーム</button><button data-tab="trade">🔄 トレード</button><button data-tab="quest">📜 依頼</button><button data-tab="battle">⚔️ 漢字バトル</button></nav><section class="panel" id="content"></section><p id="status" role="status"></p><section class="panel"><h2>🎒 もちもの</h2><div class="bag" id="bag"></div></section><p class="note">漢字バトルは時間制限なし。間違えても答えと意味を確認できます。<br>所持品・仲間・成績は同じブラウザに保存。対戦途中は保存されません。</p></main><script src="game.js"></script></html>
