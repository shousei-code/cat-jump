<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゆめねこ遊園地</title><style>
*{box-sizing:border-box}body{margin:0;background:#20203c;color:#fff0e6;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}small{letter-spacing:3px;color:#c5aedb}h1{font-size:clamp(25px,5vw,38px);margin:9px 0}a{color:#dbc6eb;font-size:12px}p{line-height:1.8}button{font:inherit;color:#fbf1ff;background:#51416e;border:1px solid #9380ab;padding:13px 17px;border-radius:16px;cursor:pointer;touch-action:manipulation}button:hover{background:#685281}button:focus-visible{outline:3px solid #ffe0a4;outline-offset:2px}button:disabled{opacity:.5}.hud{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0;font-size:13px}.hud span{background:#34304e;padding:9px 14px;border-radius:18px}.park{position:relative;overflow:hidden;border:1px solid #706185;border-radius:25px;background:linear-gradient(#42436c,#9676aa 65%,#75678e 65%);height:350px}.moon{position:absolute;top:24px;right:10%;font-size:65px;filter:drop-shadow(0 0 18px #ffe8bb)}.stars{position:absolute;inset:25px;color:#ead7fd;font-size:25px;letter-spacing:35px;pointer-events:none}.rides{position:absolute;bottom:25px;left:5%;right:5%;display:flex;gap:14px;justify-content:space-around}.rides button{width:30%;min-height:160px;background:#332e55bb;border:1px solid #c6a4d2;border-radius:60px 60px 17px 17px;padding:15px 5px}.rides i{display:block;font-style:normal;font-size:70px}.rides b{font-size:14px}.dialogue{display:grid;grid-template-columns:140px 1fr;gap:20px;background:#fff4e9;color:#65506b;border-radius:22px;margin-top:18px;padding:22px;align-items:center}.portrait svg{width:140px;height:170px}h2{font-size:20px;margin:0 0 8px}#text{margin:0;white-space:pre-line;font-size:15px}.choices,.friends,.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.choices button{flex:1;min-width:160px}.friends button{flex:1;font-size:13px}.note{font-size:12px;color:#c0b1cf}.activity{background:#322e50;border:1px solid #827099;border-radius:22px;padding:20px;margin-top:18px;text-align:center}canvas{background:#272943;border-radius:16px;width:100%;height:260px;display:block;touch-action:none}.controls{justify-content:center}.controls button{min-width:100px}.book{background:#39324e;border-radius:18px;padding:18px;margin-top:18px}.book span{display:inline-block;padding:9px;margin:5px;background:#5b486c;border-radius:12px;font-size:13px}#status{min-height:24px;color:#ffe2ab}[hidden]{display:none!important}@media(max-width:600px){main{padding:14px}.park{height:300px}.rides{gap:7px;left:3%;right:3%}.rides i{font-size:48px}.rides button{min-height:130px}.rides b{font-size:12px}.dialogue{grid-template-columns:80px 1fr;gap:12px;padding:15px}.portrait svg{width:80px;height:130px}h2{font-size:17px}#text{font-size:13px}.friends button{min-width:100px}.choices button{min-width:130px}canvas{height:240px}}
</style><main><header><div><small>THE MIDNIGHT WONDER PARK</small><h1>ゆめねこ遊園地</h1></div><a href="../">ゲーム一覧</a></header><p class="note">まくらの下に、小さな切符。目を閉じたら、へんてこな友達のいる遊園地へ。</p><div class="hud"><span id="hearts">友達 0 / 4</span><span id="stamps">思い出 0 / 3</span><span id="record">星あつめベスト 0</span></div><section class="park"><div class="stars">✦　✧　✦<br>　　✧　　✦</div><div class="moon">🌙</div><div class="rides"><button data-ride="wheel"><i>🎡</i><b>月の観覧車</b></button><button data-ride="music"><i>🎠</i><b>音の回転木馬</b></button><button data-ride="stars"><i>🌠</i><b>星のすべり台</b></button></div></section><div class="friends" id="friends"></div><section class="dialogue"><div class="portrait" id="portrait"></div><div><h2 id="speaker"></h2><p id="text"></p></div></section><div class="choices" id="choices"></div><section class="activity" id="activity" hidden><h2 id="activityTitle"></h2><p class="note" id="instructions"></p><canvas id="game" width="700" height="300" hidden></canvas><div class="controls" id="controls"></div><button id="pause" hidden>ひとやすみ</button><button id="leave">遊園地にもどる</button></section><p id="status" role="status"></p><section class="book"><h2>ゆめのアルバム</h2><div id="album"></div><button id="ending" hidden>🌅 夜明けのパレードへ</button></section><p class="note">おしゃべりと3つの遊びを楽しもう。遊びは何度でも挑戦できます。<br>友達・思い出・ベスト記録は同じブラウザに保存。音なしでも遊べます。</p></main><script src="game.js"></script></html>
