<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#211b36" />
    <title>月の魔女とユニコーンの約束</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="../">← ゲームひろば</a><b>月の魔女とユニコーンの約束</b
      ><button id="menu">冒険の地図</button>
    </header>
    <main>
      <div id="hud"><span id="stageLabel"></span><span id="stats"></span></div>
      <canvas
        id="game"
        width="900"
        height="540"
        aria-label="魔法の冒険ステージ"
      ></canvas>
      <div id="objective"></div>
      <div class="controls">
        <div class="pad">
          <button data-dir="up" aria-label="上へ">▲</button>
          <div>
            <button data-dir="left" aria-label="左へ">◀</button
            ><button data-dir="down" aria-label="下へ">▼</button
            ><button data-dir="right" aria-label="右へ">▶</button>
          </div>
        </div>
        <div class="spells">
          <button data-spell="star">✦ 星の魔法<small>J · 魔力0</small></button
          ><button data-spell="lightning">
            ϟ 電気魔法<small>K · 魔力22</small></button
          ><button data-spell="ice">❄ 氷魔法<small>L · 魔力16</small></button
          ><button data-spell="heal">♡ 回復<small>H · 魔力35</small></button
          ><button data-spell="unicorn">
            🦄 変身<small>U · 第6面から</small>
          </button>
        </div>
      </div>
      <p class="help">
        矢印 /
        WASD：移動　星の魔法は長押しで連射。魔法は近くの敵を自動で狙います。赤い円から逃げよう！
      </p>
    </main>
    <div id="toast" role="status"></div>
    <dialog id="dialog"><div id="panel"></div></dialog>
    <script type="module" src="game.js"></script>
  </body>
</html>
