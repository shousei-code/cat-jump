<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f9e9f1" />
    <title>シールの島 ♡ きらめきアスレチック</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="world" aria-label="シールを探す3Dの島"></canvas>
    <header>
      <a href="../">← ゲームひろば</a
      ><strong>シールの島 <small>STICKER ISLAND</small></strong
      ><span id="coins">✧ 60</span>
    </header>
    <nav id="menu">
      <button data-panel="book">📖 シール帳</button
      ><button data-panel="gacha">🎀 ガチャ</button
      ><button data-panel="job">📦 お仕事</button
      ><button data-panel="avatar">☺ キャラクター</button
      ><button data-panel="online">☁ みんなで</button>
    </nav>
    <aside id="guide">
      <b>小さな冒険を、1枚ずつ。</b>
      <p>
        矢印 / WASD で移動 · スペースでジャンプ<br />3つのコースと広場で、シールを見つけよう。
      </p>
      <span id="progress"></span><button id="home">広場へ戻る</button>
    </aside>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="roomBadge" hidden></div>
    <div id="touch">
      <div class="pad">
        <button data-move="up" aria-label="前に進む">▲</button>
        <div>
          <button data-move="left" aria-label="左へ">◀</button
          ><button data-move="down" aria-label="後ろへ">▼</button
          ><button data-move="right" aria-label="右へ">▶</button>
        </div>
      </div>
      <button id="jump">ジャンプ</button>
    </div>
    <dialog id="dialog">
      <button id="close" aria-label="閉じる">×</button>
      <div id="panel"></div>
    </dialog>
    <script src="vendor/peerjs.min.js"></script>
    <script type="module" src="game.js"></script>
  </body>
</html>
