</style><main><header><div><small>MY LITTLE STYLE & TOWN</small><h1>🎀 ミルキー・ワールド</h1></div><a href="../">ゲーム一覧</a></header><p class="note">自分だけのスタイルで、小さな街へ。髪も目も、お洋服も、好きな組み合わせに。</p><nav class="nav"><button id="editTab" class="active">🎀 キャラクター</button><button id="townTab">🏡 街であそぶ</button></nav><section id="closet" class="layout"><div class="stage"><span class="tag" id="nameTag">わたしのキャラクター</span><div class="avatar" id="avatar"></div><p class="note">最初は髪なし・シンプルなインナー姿。<br>好きなパーツを選んで変身しよう！</p></div><div class="editor"><h2>わたしのコーディネート</h2><label>なまえ <input id="name" maxlength="12" placeholder="なまえをつけよう"></label><div class="tabs" id="tabs" style="margin-top:16px"></div><div class="options" id="options"></div><div class="options" id="colors"></div><div class="actions"><button id="cute">🎀 かわいい</button><button id="cool">⚡ かっこいい</button><button id="random">🎲 おまかせ</button></div><button class="primary" id="go">この姿で街へ！ →</button><p class="note">変更はこのブラウザに自動保存。お店でお仕事をすると星が増えます。</p></div></section><section id="town" hidden><h2 id="place">ようこそ、ミルキー通りへ</h2><div class="rooms"><button data-place="street">🌷 街</button><button data-place="cafe">🧁 カフェ</button><button data-place="park">🌳 公園</button><button data-place="home">🛋 お部屋</button><button id="talk">💬 お友達とお話</button></div><div class="scene" id="scene"><button class="building" data-place="cafe" style="left:3%">🧁<strong>カフェ・リボン</strong>お仕事しよう</button><button class="building" data-place="park">🌳<strong>はなびら公園</strong>お友達に会おう</button><button class="building" data-place="home">🏡<strong>マイルーム</strong>お部屋を飾ろう</button><div class="player" id="player"></div><div class="npc" id="npc">リリ：いっしょに遊ぼう！</div></div><div class="rooms" id="activities"></div><p class="note">街の地面をタップすると移動できます。パソコンでは左右の矢印キーでも移動。</p><p id="stars"></p></section><p id="status" role="status"></p><p class="note">保存は端末・ブラウザごとです。名前などを外部に送信する機能はありません。</p></main><script src="game.js"></script></html>
