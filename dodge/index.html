<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みんなでドッジボール！</title><style>*{box-sizing:border-box}body{margin:0;background:#fff7e8;color:#5b5145;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:clamp(23px,4vw,34px)}a{color:#927960;font-size:12px}.banner{width:100%;max-height:330px;object-fit:cover;border-radius:24px}.panel{background:#fffdf6;border:1px solid #e6d5b8;border-radius:22px;padding:20px;margin:18px 0}button{font:inherit;border:1px solid #d7bd9e;border-radius:13px;padding:12px;background:#fff9ed;color:#796350;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}button:focus-visible{outline:3px solid #b78fc2}.primary{background:#b77b68;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid button{font-size:14px}.grid button[aria-pressed=true]{background:#f1c4b7;outline:2px solid #c98b76}.grid b{display:block;font-size:30px}.actions,.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:15px 0}.hud span{padding:9px 14px;background:white;border-radius:15px;font-size:13px}canvas{display:block;width:100%;aspect-ratio:8/5;touch-action:none;background:#efd2a4;border-radius:22px;border:1px solid #d7b895}.controls{display:flex;justify-content:space-between;gap:12px;margin:16px 0}.pad{display:grid;grid-template-columns:repeat(3,44px);gap:4px}.pad button{padding:9px;touch-action:none;user-select:none}.skills{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:end}.note{font-size:12px;color:#968575;line-height:1.9}h2{font-size:20px}#status{min-height:44px;line-height:1.8}#team{display:flex;gap:8px;flex-wrap:wrap}#team button.active{background:#f0c4b6}#result{background:#f7e1aa;padding:20px;border-radius:18px}[hidden]{display:none!important}@media(max-width:600px){main{padding:13px}.panel{padding:16px}.banner{max-height:220px}.controls{gap:7px}.skills button{font-size:12px;padding:10px}.pad{grid-template-columns:repeat(3,38px)}.grid{gap:7px}.grid button{padding:9px}.hud{gap:7px}.hud span{font-size:12px;padding:8px}}
</style><main><header><h1>🏐 みんなでドッジボール！</h1><a href="../">ゲームひろばへ</a></header><section id="setup"><img class="banner" src="assets/tournament.png" alt="こっちゃんたちのドッジボール大会。ゴーリさんが審判"><div class="panel"><h2>あかチームの3人を選ぼう！</h2><p class="note">残りの仲間から相手3人と応援3人が決まります。1人用で、仲間と相手はコンピューターが操作します。</p><div class="grid" id="roster"></div><div class="actions"><button id="start" class="primary">この3人で試合開始！</button><span id="selection"></span></div></div></section><section id="match" hidden><div class="hud"><span id="time"></span><span id="score"></span><button id="pause">一時停止</button><button id="menu">チームを選び直す</button></div><canvas id="court" width="800" height="500" aria-label="ドッジボールコート。赤チームを動かしてボールをよけよう"></canvas><div class="controls"><div class="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div class="skills"><button id="throw" class="primary">🏐 なげる</button><button id="dodge">💨 よける</button></div></div><div id="team"></div><p id="status" role="status"></p><div id="result" hidden></div><p class="note">移動：矢印 / WASD / 画面ボタン。投げる：スペース。よける：Shift。Pで一時停止。<br>投げると一番近い相手を狙います。コートの相手をタップして狙いを変えることもできます。<br>1人2回当たるとアウト。90秒後は残りのハートが多いチームの勝ち！ 仲間の名前を押すと操作を交代。</p></section><p class="note">やわらかいボールの架空の大会です。勝利数はこのブラウザに保存されます。</p></main><script src="game.js"></script></html>
