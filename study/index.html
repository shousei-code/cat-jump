<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まなびバトルドリル</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f5;color:#3e5964;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:clamp(22px,4vw,32px)}a{color:#648d95}button,input,select,textarea{font:inherit;padding:12px;border:1px solid #b9d4d4;border-radius:12px;background:#fffef9;color:#406974}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #91b6cf}.primary{background:#5d96a3;color:white}.nav,.actions,.settings{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button[aria-pressed=true]{background:#679ca4;color:white}.panel{background:#fffefa;border:1px solid #d4e1dc;border-radius:22px;padding:24px;margin:18px 0}h2{font-size:21px;margin:0 0 15px}.note{font-size:12px;color:#8b9d9f;line-height:1.9}.question{font-size:24px;line-height:1.7;white-space:pre-line}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{font-size:18px;min-height:65px}.info{padding:15px;border-radius:15px;background:#e6f1e9;line-height:1.9;margin:15px 0}.score{font-size:14px;color:#72939b;margin:12px 0}.list button{display:block;width:100%;text-align:left;margin:8px 0}label{display:block;font-size:13px;margin:12px 0}textarea,input[type=text]{width:100%;margin-top:6px}textarea{min-height:75px}.writing{display:grid;grid-template-columns:1fr 1fr;gap:20px}.model{height:300px;background:#eff4ec;display:grid;place-items:center;font-family:serif;font-size:170px;border-radius:16px}canvas{width:100%;height:300px;border:1px solid #a8c9ca;border-radius:16px;touch-action:none;background:linear-gradient(90deg,transparent 49.7%,#d3e1df 49.7%,#d3e1df 50.3%,transparent 50.3%),linear-gradient(transparent 49.7%,#d3e1df 49.7%,#d3 </style><main><header><h1>📚 まなびバトルドリル</h1><a href="../">ゲームひろばへ</a></header><p class="note">漢字・算数・理科・社会を、自分のペースで。問題や正解を自分で直したり、問題を追加したりできます。</p><nav class="nav"><button data-view="home">🏡 はじめる</button><button data-view="review">🔁 間違い直し</button><button data-view="write">✍️ 漢字を書く</button><button data-view="edit">📝 問題を訂正・追加</button></nav><section class="panel" id="panel"></section><p id="status" role="status"></p><p class="note">2人対戦は同じ端末を交代して使います。オンライン対戦ではありません。コンピューターの答えはゲーム内の演出です。<br>編集した問題・学習記録は、この端末のブラウザに保存されます。</p></main><script src="game.js"></script></html>
