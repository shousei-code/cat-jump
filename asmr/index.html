<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>しずくのASMR工房</title><style>
*{box-sizing:border-box}body{margin:0;background:#111d24;color:#e4efea;font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:25px 18px}header{display:flex;justify-content:space-between;align-items:center}small{letter-spacing:3px;color:#96b9b0}h1{font-size:clamp(23px,5vw,36px);font-weight:500;margin:10px 0}a{color:#a6c3bd;font-size:12px}.intro{color:#9fb5b3;font-size:14px;line-height:1.8}.hud{display:flex;flex-wrap:wrap;gap:20px;padding:20px 0}.hud b{color:#e3d5b4}.card{border:1px solid #3b5358;border-radius:26px;padding:25px;background:radial-gradient(ellipse at top,#2c4347,#182a31);box-shadow:0 24px 60px #0003;text-align:center}.art{height:130px;display:grid;place-items:center}.orb{width:83px;height:83px;border-radius:25px;transform:rotate(45deg);background:linear-gradient(135deg,#d8f4e9aa,#73bcb955,#f1dcb455);border:1px solid #d4eee999;box-shadow:inset 0 0 25px #e4ffff33,0 0 60px #a1dfd51c;transition:filter .15s}.orb.hit{filter:brightness(1.8)}.track{height:70px;background:#0d1c23;border:1px solid #48615f;border-radius:16px;position:relative;margin:28px 0;overflow:hidden}.target{position:absolute;top:0;height:100%;background:#c1dec26b;border-left:2px solid #c4dfbc;border-right:2px solid #c4dfbc}.center{position:absolute;left:50%;top:0;height:100%;width:1px;background:#f1e3b7}.needle{position:absolute;top:5px;bottom:5px;width:4px;transform:translateX(-50%);background:#fff6da;box-shadow:0 0 16px #ffffbd;border-radius:4px}button{font:inherit;border:1px solid #526c6a;background:#243d41;color:#e4efea;border-radius:13px;padding:12px 18px;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #f0dab0}button:disabled{opacity:.45}.primary{background:#d8dfc7;color:#283c38;border:0;font-size:20px;font-weight:700;width:100%;padding:20px}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}.selected{border-color:#e1d6ac;background:#4c625d}.settings{margin-top:22px;border-top:1px solid #3c5256;padding-top:20px;display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap}input{max-width:140px;accent-color:#b8d4c5}#status{min-height:48px;line-height:1.7;color:#dcd4bd}#steps{letter-spacing:5px;font-size:20px;color:#c5dac8;overflow-wrap:anywhere}.note{font-size:12px;color:#9fb6b5;line-height:1.9}.sound{font-size:13px}.tip{color:#bdd2c7;font-size:13px}[hidden]{display:none!important}@media(max-width:500px){main{padding:18px 12px}.card{padding:19px 15px}.hud{gap:12px;font-size:13px}.controls{gap:7px}button{padding:11px 13px}.art{height:105px}#steps{font-size:16px;letter-spacing:3px}}
</style><main><header><div><small>QUIET HANDS • SHARP TIMING</small><h1>💧 しずくのASMR工房</h1></div><a href="../">ゲーム一覧</a></header><p class="intro">ひと押しに、耳をすませて。<br>小さな的に針を止めて、12音の作品を完成させよう。</p><div class="hud"><span id="stage">工程 <b>1 / 12</b></span><span id="lives">チャンス ♡♡♡</span><span id="best">最高到達 0</span></div><section class="card"><div class="controls" id="modes"><button data-mode="hard" class="selected">超むず</button><button data-mode="practice">練習</button></div><div class="art"><div class="orb" id="orb"></div></div><div id="steps">◇◇◇◇◇◇◇◇◇◇◇◇</div><div class="track" aria-label="光の針を、緑色の的の中で止めよう"><div class="target" id="target"><i class="center"></i></div><div class="needle" id="needle"></div></div><p id="status" role="status">音量は小さめから。スタートすると音が使えます。</p><button class="primary" id="action">工房をはじめる</button><div class="controls"><button id="pause" disabled>一時停止</button><button id="restart">最初から</button><button id="replay" hidden>完成した音を聴く ♪</button></div><p class="tip">タップ / スペースで止める。緑の的の中なら成功！</p><div class="settings"><label class="sound">音量 <input id="volume" type="range" min="0" max="100" value="25"></label><button id="mute" aria-pressed="false">音 ON</button></div><div class="controls"><button data-sound="glass" class="selected">✧ ガラス</button><button data-sound="wood">▧ 木の音</button><button data-sound="rain">☂ 雨の音</button></div></section><p class="note">超むず：3回ミスで終了。後半は的が動き、針も速くなります。<br>練習：ミスしても続けられます。音なしでも遊べます。Pで一時停止。<br>音はブラウザ内で合成しています。最高到達工程は、この端末のブラウザに保存されます。</p></main><script src="game.js"></script></html>
