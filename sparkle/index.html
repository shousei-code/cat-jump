<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>きみが主役の放課後</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4f3;color:#654d65;font-family:system-ui,sans-serif}main{max-width:950px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(24px,4vw,34px)}a{color:#92718e;font-size:12px}button,input,select{font:inherit;border:1px solid #dcc6da;border-radius:14px;padding:12px;background:#fffcfa;color:#795f7e}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #c196be}button.active{background:#a77eaa;color:white}.note{font-size:12px;color:#a1889a;line-height:1.9}.settings,.choices,.places{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.settings label{font-size:12px}.settings input{width:150px}.cast{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.cast button{padding:5px;overflow:hidden}.face{background-image:url('../school/assets/classmates.png');background-size:300% 200%;background-position:var(--x) var(--y);aspect-ratio:1;border-radius:12px}.cast span{display:block;font-size:12px;padding:6px}.scene{margin-top:22px;border:1px solid #e5d0df;border-radius:24px;overflow:hidden;background:linear-gradient(120deg,#ead9ee,#ffe6dc)}.portraits{display:flex;justify-content:center;gap:12px;padding:22px 12px 0}.portrait{width:310px;max-width:80%;border-radius:20px 20px 0 0}.dialogue{padding:23px;background:#fffdf9}h2{font-size:19px;margin:0 0 13px}#text{white-space:pre-line;line-height:1.95;margin:0}.choices button{flex:1;min-width:140px}.album{padding:20px;border-radius:20px;background:#f5e9f1;margin-top:22px}.album p{font-size:13px;line-height:1.8;border-bottom:1px solid #dfcadd;padding-bottom:10px}#count{font-size:13px;color:#a57e9e}.tag{display:inline-block;margin:15px 20px 0;background:#fff9;padding:7px 12px;border-radius:15px;font-size:12px}@media(max-width:650px){main{padding:14px}.cast{grid-template-columns:repeat(3,1fr)}.portrait{width:270px}.dialogue{padding:18px}#text{font-size:14px}.places button{padding:9px;font-size:12px}.settings{gap:8px}.settings input{width:130px}}[hidden]{display:none!important}</style><main><header><h1>🌷 きみが主役の放課後</h1><a href="../">ゲームひろばへ</a></header><p class="note">今日は、少しだけ甘やかされる日。好きな相手とお出かけして、あたたかい言葉を集めよう。<br>人物は写真ではなく、立体感のあるイラストです。架空の同年代の友達との、やさしい物語です。</p><div class="settings"><label>呼んでほしい名前<br><input id="name" maxlength="12" placeholder="なまえ"></label><label>今日のコーデ<br><select id="outfit"><option>リボンのワンピース</option><option>かっこいいジャケット</option><option>ふわふわカーディガン</option></select></label></div><div class="cast" id="cast"></div><div class="places" id="places"></div><section class="scene"><div class="tag" id="location"></div><div class="portraits" id="portrait"></div><div class="dialogue"><h2 id="speaker"></h2><p id="text"></p></div></section><div class="choices" id="choices"></div><p id="count"></p><button id="all">🎉 みんなのごほうびパーティー</button><section class="album"><h2>💌 もらった言葉のアルバム</h2><div id="album"></div></section><p class="note">名前・コーデ・アルバムは、このブラウザに保存。外部の人との会話やメッセージ送信はありません。</p></main><script src="game.js"></script></html>
