<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5ef"><title>こもれびドールハウス</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff7f1;color:#65545e;font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif}header{padding:18px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eddfe0;background:#fffaf7}h1{font-size:23px;margin:4px 0}small{font-size:10px;letter-spacing:.2em;color:#ac7a8e}.sub{font-size:12px;color:#967f8c}button{font:inherit;cursor:pointer;border:1px solid #eadbe0;border-radius:14px;padding:11px 15px;background:#fff;color:#705c68;touch-action:manipulation}button:hover{background:#fff1f6}button:focus-visible{outline:3px solid #bc7999}button.active{background:#9a6886;color:white;border-color:#9a6886}.layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;max-width:1450px;margin:auto}.stage{position:relative;min-width:0;background:radial-gradient(ellipse at center,#fff8f3,#eedee5);height:calc(100dvh - 100px);min-height:480px;max-height:950px}canvas{display:block;width:100%;height:100%;touch-action:none}.float{position:absolute;top:18px;left:20px;right:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}.pill{border-radius:20px;background:#fffaf6e8;padding:9px 14px;font-size:12px;box-shadow:0 3px 15px #95788b12}.bottom{position:absolute;bottom:20px;left:20px;right:20px;display:flex;gap:8px;align-items:center;justify-content:center}.bottom button{box-shadow:0 3px 15px #95788b12;font-size:13px}.panel{padding:20px;background:#fffaf7;border-left:1px solid #eddfe0;overflow-y:auto;max-height:calc(100dvh - 100px)}h2{font-size:15px;margin:22px 0 12px}h2:first-child{margin-top:0}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modes button{font-size:13px;padding:11px 8px}.hint{font-size:12px;line-height:1.8;color:#9b8290}.swatches{display:flex;gap:9px}.swatch{width:37px;height:37px;padding:0;border:3px solid white;box-shadow:0 0 0 1px #dfcbd5}.swatch.active{box-shadow:0 0 0 2px #926380}.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}.items button{font-size:12px}.status{font-size:11px;color:#9b8290;line-height:1.8}#selected{padding:12px;background:#f5e9ef;border-radius:12px;font-size:12px;line-height:1.8;margin-top:12px}#selected button{padding:7px 10px;font-size:12px;margin-top:8px}#error{position:absolute;inset:25%;background:#fff;padding:25px;z-index:5;border-radius:20px;line-height:1.8}#error[hidden]{display:none}a{color:#93677b;font-size:12px}@media(max-width:800px){header{padding:12px 16px}h1{font-size:19px}.sub{display:none}.layout{display:flex;flex-direction:column}.stage{height:58dvh;min-height:380px}.panel{max-height:none;border-left:0;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.section h2{margin-top:0}.bottom{bottom:12px;left:8px;right:8px;gap:5px}.bottom button{padding:10px;font-size:11px}.float{left:12px;top:12px}.hint{font-size:11px}.status{grid-column:1/-1}}
</style></head><body><header><div><small>MY LITTLE WORLD · 3D</small><h1>こもれびドールハウス 🎀</h1><span class="sub">わたしの好きが、いっぱいのおへや。</span></div><a href="../">🐱 猫のゲームへ</a></header><div class="layout"><section class="stage" id="stage" aria-label="3Dのお部屋"><div class="float"><span class="pill" id="guide">床をタップして、おさんぽしよう</span><span class="pill" id="saveStatus" role="status">準備中…</span></div><div id="error" hidden></div><div class="bottom"><button id="turnLeft" aria-label="左の視点">↶ 視点</button><button id="wave">👋 ごあいさつ</button><button id="zoomOut" aria-label="縮小">−</button><button id="zoomIn" aria-label="拡大">＋</button><button id="turnRight" aria-label="右の視点">視点 ↷</button></div></section><aside class="panel"><div class="section"><h2>今日は、なにしよう？</h2><div class="modes"><button id="walk" class="active">👣 おさんぽ</button><button id="edit">🛋 模様替え</button></div><p class="hint" id="help">床をタップすると女の子が歩きます。パソコンでは矢印キーでも動けます。</p><div id="selected" hidden><span id="selectionName"></span><br><button id="rotate">↻ 向きを変える</button> <button id="remove">しまう</button></div></div><div class="section"><h2>🎀 ワンピースの色</h2><div class="swatches" id="dressColors"></div><h2>💇 髪の色</h2><div class="swatches" id="hairColors"></div></div><div class="section"><h2>🌷 壁紙の色</h2><div class="swatches" id="wallColors"></div><p class="hint">やさしい色で、お気に入りの空間に。</p></div><div class="section"><h2>🧸 家具をふやす</h2><div class="items" id="catalog"></div><p class="hint">模様替えでは家具を選んでから床をタップ。または家具をドラッグ！</p></div><div class="status">家具や色は自動保存されます。<br>このブラウザーだけの保存です。別の端末への同期はまだありません。<br><button id="reset" style="margin-top:10px;font-size:11px">最初のおへやに戻す</button></div></aside></div><script type="module" src="app.js"></script></body></html>
