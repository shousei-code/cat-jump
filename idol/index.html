<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>きらめきアイドル・デビュー！</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4f5;color:#674e70;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(24px,4vw,34px);margin:8px 0}small{letter-spacing:2px;color:#b187a6}a{color:#927199;font-size:12px}.hud,.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.hud span{background:white;border:1px solid #edd4e4;padding:10px 14px;border-radius:16px;font-size:13px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stage{position:relative;background:radial-gradient(ellipse at top,#f6cae6,#a188bf 70%,#776c9e);border-radius:25px;overflow:hidden;min-height:390px;text-align:center;padding-top:20px}.stage:before{content:'✧　　✦　　✧';color:#fff5c8;font-size:36px;letter-spacing:20px}.avatar{height:300px}.avatar svg{height:100%;width:100%}.tag{display:inline-block;background:#fff9;padding:6px 15px;border-radius:15px;margin-bottom:12px}.panel{background:#fffdfa;border:1px solid #e7d7e2;border-radius:24px;padding:22px}h2{font-size:19px;margin:0 0 14px}button,input,select{font:inherit}button{background:#faf2fb;border:1px solid #d8bedc;border-radius:14px;padding:12px 16px;color:#785582;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #af86c1;outline-offset:3px}.primary{background:#ae79a9;color:white}.actions button{flex:1;min-width:120px}input,select{padding:9px;border:1px solid #dbc7df;border-radius:10px;background:#fffafc;color:#674e70;max-width:100%}label{display:block;font-size:13px;margin:12px 0}#status{line-height:1.8;min-height:50px;font-size:14px}.note{font-size:12px;color:#a1889d;line-height:1.8}.live{margin-top:20px;background:#342b50;color:#fff0fa;border-radius:24px;padding:20px}canvas{width:100%;height:300px;display:block;background:#211e3a;border-radius:16px}.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.pads button{font-size:18px;background:#9071b0;color:white;touch-action:none}.livehead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.wardrobe{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.wardrobe button{font-size:12px}.wardrobe button[aria-pressed=true]{background:#9c7eb0;color:white}[hidden]{display:none!important}@media(max-width:650px){main{padding:15px}.layout{grid-template-columns:1fr;gap:12px}.stage{min-height:300px}.avatar{height:230px}.panel{padding:18px}canvas{height:280px}.hud{gap:7px}.hud span{font-size:12px;padding:9px}.live{padding:14px}}
</style><main><header><div><small>MY SHINING IDOL STORY</small><h1>🎤 きらめきアイドル・デビュー！</h1></div><a href="../">ゲームひろばへ</a></header><div class="hud"><span id="fans"></span><span id="skill"></span><span id="coins"></span><span id="energy"></span></div><div class="layout"><section class="stage"><div class="avatar" id="avatar"></div><div class="tag" id="nameTag">わたしのステージ</div></section><section class="panel"><h2>わたしだけのアイドル</h2><label>芸名 <input id="name" maxlength="12" placeholder="なまえを決めよう"></label><label>髪型 <select id="hair"><option value="0">ツインテール</option><option value="1">ふんわりボブ</option><option value="2">ロングヘア</option></select></label><label>髪色 <select id="color"><option value="#c589ac">ピンク</option><option value="#74564e">チョコ</option><option value="#d4ae70">ハニー</option><option value="#8e80ba">ラベンダー</option></select></label><div class="wardrobe" id="wardrobe"></div><div class="actions"><button id="train">🎵 歌・ダンス練習<br>元気 −10</button><button id="rest">☕ おやすみ<br>元気 ＋40</button></div><div class="actions"><button id="start" class="primary">✨ ライブへ！<br>元気 −20</button></div><p id="status" role="status">まずは芸名と衣装を決めよう！ 練習するとライブのファン獲得が少しアップ。</p><p class="note" id="rank"></p></section></div><section class="live" id="live" hidden><div class="livehead"><b id="song">はじめてのきらめき</b><span id="score"></span><span id="time"></span></div><canvas id="game" width="600" height="360" aria-label="星が下のラインに来たら、同じ列のボタンを押そう"></canvas><div class="pads"><button data-lane="0">🌸 D</button><button data-lane="1">⭐ F</button><button data-lane="2">💜 J</button></div><div class="actions"><button id="pause">一時停止</button><button id="sound" aria-pressed="false">音 ON</button><button id="quit">ライブをやめる</button></div><p id="judge" role="status">星が白いラインに来たら押してね！</p></section><p class="note">ライブ：D・F・J、または画面の3つのボタン。Pで一時停止。音なしでも遊べます。<br>芸名・衣装・ファン・コインはこのブラウザに保存。コインはゲーム内だけのものです。</p></main><script src="game.js"></script></html>
